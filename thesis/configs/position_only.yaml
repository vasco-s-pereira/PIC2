# All classes share (Q1, Q2) and differ only in f_n (with int f_n = 1/2, so unigram counts
# carry no information). Bayes-optimal ~0.87 at K=128.
task:
  n_classes: 8
  vocab_size: 32
  concentration: 0.5
  position_only: true
  seed: 0
model:
  n_layer: 2
  n_head: 4
  n_embd: 128
  attention: discrete
  pooling: mean
  n_basis: 32
train:
  K: 128
  steps: 3000
  batch_size: 64
  lr: 1.0e-3
  eval_every: 500
  baselines: true
  out_dir: runs/position_only
