# Initial configuration: V=32, N=8, K=128, 2 layers, 4 heads, d=128, N_b=32.
# Bayes-optimal accuracy at K=128 is ~0.90 with concentration 10.
task:
  n_classes: 8
  vocab_size: 32
  concentration: 10.0
  position_only: false
  seed: 0
model:
  n_layer: 2
  n_head: 4
  n_embd: 128
  attention: discrete
  pooling: mean
  n_basis: 32
  ridge: 1.0e-3
  init_var: 0.01
train:
  K: 128
  steps: 3000
  batch_size: 64
  lr: 1.0e-3
  eval_every: 500
  eval_size: 4096
  seed: 0
  out_dir: runs/base
